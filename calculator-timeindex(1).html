<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Калькулятор времени">
<meta name="theme-color" content="#101827">
<title>Калькулятор времени</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
body{min-height:100vh;padding:18px 14px calc(30px + env(safe-area-inset-bottom));padding-top:calc(18px + env(safe-area-inset-top));background:linear-gradient(135deg,#08111f,#162338 55%,#070d18);color:#fff}
body.day{background:linear-gradient(135deg,#dbeafe,#f8fafc 55%,#e0e7ff);color:#172033}
.app{width:100%;max-width:560px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.title{font-size:25px;font-weight:800}.sub{font-size:13px;opacity:.62;margin-top:4px}
.theme{width:48px;height:44px;border:0;border-radius:14px;background:rgba(255,255,255,.1);color:inherit;font-size:21px}
.card{border-radius:25px;padding:18px;background:rgba(17,24,39,.76);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 18px 50px rgba(0,0,0,.25)}
body.day .card{background:rgba(255,255,255,.76);border-color:rgba(15,23,42,.1)}
.times{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.box{padding:14px;border-radius:18px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.09)}
body.day .box{background:rgba(15,23,42,.045);border-color:rgba(15,23,42,.08)}
.label{font-size:13px;opacity:.7;margin-bottom:8px}
.time-display{width:100%;height:54px;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:rgba(10,18,32,.8);color:#fff;font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center;letter-spacing:1px;cursor:pointer}
body.day .time-display{background:rgba(255,255,255,.9);color:#172033;border-color:rgba(15,23,42,.13)}
.time-display.active{border-color:#60a5fa;box-shadow:0 0 0 2px rgba(96,165,250,.14)}
.calc{width:100%;height:56px;margin-top:14px;border:0;border-radius:17px;background:#3b82f6;color:#fff;font-size:17px;font-weight:800}
.result{margin-top:14px;padding:18px;text-align:center;border-radius:19px;background:rgba(59,130,246,.12);border:1px solid rgba(96,165,250,.2)}
.result small{opacity:.65}.result strong{display:block;font-size:31px;margin-top:4px}
.settings{margin-top:14px}.settings-title{font-size:16px;font-weight:800;margin-bottom:12px}.setting{margin:13px 0}.setting-title{font-size:13px;opacity:.72;margin-bottom:7px}
select{width:100%;height:48px;border-radius:14px;border:1px solid rgba(255,255,255,.13);background:rgba(20,30,46,.88);color:#fff;padding:0 12px;font-size:15px}
body.day select{background:rgba(255,255,255,.92);color:#172033}
input[type=range]{width:100%;accent-color:#3b82f6}
.file{width:100%;padding:12px;border-radius:14px;border:1px dashed rgba(255,255,255,.2);background:rgba(255,255,255,.04);color:inherit}
.reset{width:100%;height:48px;margin-top:10px;border-radius:14px;border:1px solid rgba(255,255,255,.14);background:transparent;color:inherit;font-weight:700}

/* Своя цифровая клавиатура — iPhone больше не использует поле ввода времени */
.keypad{display:none;margin-top:14px;padding:12px;border-radius:20px;background:rgba(7,13,24,.94);border:1px solid rgba(255,255,255,.12)}
body.day .keypad{background:rgba(255,255,255,.92);border-color:rgba(15,23,42,.12)}
.key-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:14px;font-weight:700}
.slots{display:flex;justify-content:center;gap:7px;margin-bottom:11px}
.slot{width:39px;height:42px;border-radius:10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.13);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800}
body.day .slot{background:rgba(15,23,42,.06);border-color:rgba(15,23,42,.12)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.key{height:48px;border:0;border-radius:12px;background:rgba(255,255,255,.09);color:#fff;font-size:20px;font-weight:700}
body.day .key{background:rgba(15,23,42,.08);color:#172033}
.key:active{transform:scale(.97);background:#3b82f6;color:#fff}
.key.clear{font-size:15px}.key.ok{grid-column:span 3;background:#3b82f6;color:#fff;font-size:16px}
@media(max-width:390px){body{padding-left:10px;padding-right:10px}.card{padding:14px}.box{padding:11px}.times{gap:8px}.title{font-size:22px}.slot{width:35px}}
</style>
</head>
<body>
<main class="app">
<div class="top"><div><div class="title">⏱️ Калькулятор времени</div><div class="sub">Нажмите на время и введите 4 цифры</div></div><button class="theme" id="theme" type="button">☀️</button></div>
<section class="card" id="card">
<div class="times">
<div class="box"><div class="label">Начало</div><button class="time-display" id="startBtn" type="button">15:00</button></div>
<div class="box"><div class="label">Конец</div><button class="time-display" id="endBtn" type="button">13:45</button></div>
</div>
<div class="keypad" id="keypad">
<div class="key-title"><span id="keyTitle">Введите время</span><span>4 цифры</span></div>
<div class="slots"><div class="slot" id="s0">_</div><div class="slot" id="s1">_</div><div class="slot">:</div><div class="slot" id="s2">_</div><div class="slot" id="s3">_</div></div>
<div class="keys">
<button class="key" data-n="1" type="button">1</button><button class="key" data-n="2" type="button">2</button><button class="key" data-n="3" type="button">3</button>
<button class="key" data-n="4" type="button">4</button><button class="key" data-n="5" type="button">5</button><button class="key" data-n="6" type="button">6</button>
<button class="key" data-n="7" type="button">7</button><button class="key" data-n="8" type="button">8</button><button class="key" data-n="9" type="button">9</button>
<button class="key clear" id="back" type="button">⌫ Назад</button><button class="key" data-n="0" type="button">0</button><button class="key clear" id="clear" type="button">Очистить</button>
<button class="key ok" id="ok" type="button">Готово</button>
</div></div>
<button class="calc" id="calculate" type="button">Рассчитать</button>
<div class="result"><small>Прошло времени</small><strong id="result">1 час 45 минут</strong></div>
<div class="settings">
<div class="settings-title">Настройки</div>
<div class="setting"><div class="setting-title">Стиль</div><select id="style"><option value="glass">Стеклянный</option><option value="soft">Мягкий</option><option value="neon">Неоновый</option><option value="classic">Классический</option></select></div>
<div class="setting"><div class="setting-title">Прозрачность</div><input id="opacity" type="range" min="45" max="95" value="76"></div>
<div class="setting"><div class="setting-title">Яркость</div><input id="brightness" type="range" min="70" max="120" value="100"></div>
<div class="setting"><div class="setting-title">Фон</div><select id="wallpaper"><option value="none">Без обоев</option><option value="palms">🌴 Пальмы и море</option><option value="mountains">🏔️ Горы</option><option value="christmas">🎄 Новый год</option><option value="winter">❄️ Зимняя ночь</option><option value="stars">🌌 Ночное небо</option></select></div>
<div class="setting"><div class="setting-title">Свои обои</div><input class="file" id="customWallpaper" type="file" accept="image/*"></div>
<button class="reset" id="reset" type="button">Сбросить настройки</button>
</div></section></main>
<script>
(function(){
const $=id=>document.getElementById(id), body=document.body, card=$("card");
let active=null, digits="";
const values={start:"15:00",end:"13:45"};

function renderSlots(){
  for(let i=0;i<4;i++) $(("s"+i)).textContent=digits[i]||"_";
}
function openPad(which){
  active=which; digits=values[which].replace(":","");
  $("keyTitle").textContent=which==="start"?"Начало":"Конец";
  $("keypad").style.display="block";
  $("startBtn").classList.toggle("active",which==="start");
  $("endBtn").classList.toggle("active",which==="end");
  renderSlots();
}
function valid(d){
  if(d.length!==4)return false;
  const h=Number(d.slice(0,2)),m=Number(d.slice(2));
  return h<=23&&m<=59;
}
function setValue(){
  if(!active||!valid(digits))return;
  values[active]=digits.slice(0,2)+":"+digits.slice(2);
  $(active+"Btn").textContent=values[active];
}
function calculate(){
  const a=values.start.split(":").map(Number),b=values.end.split(":").map(Number);
  let d=(b[0]*60+b[1])-(a[0]*60+a[1]);if(d<0)d+=1440;
  const h=Math.floor(d/60),m=d%60;
  const word=(n,a,b,c)=>{const x=n%100,y=n%10;if(x>=11&&x<=14)return c;if(y===1)return a;if(y>=2&&y<=4)return b;return c};
  if(!h&&!m)$("result").textContent="0 минут";
  else if(!h)$("result").textContent=m+" "+word(m,"минута","минуты","минут");
  else if(!m)$("result").textContent=h+" "+word(h,"час","часа","часов");
  else $("result").textContent=h+" "+word(h,"час","часа","часов")+" "+m+" "+word(m,"минута","минуты","минут");
}
$("startBtn").onclick=()=>openPad("start");
$("endBtn").onclick=()=>openPad("end");
document.querySelectorAll("[data-n]").forEach(btn=>btn.onclick=()=>{
 if(digits.length<4)digits+=btn.dataset.n;
 renderSlots();
});
$("back").onclick=()=>{digits=digits.slice(0,-1);renderSlots()};
$("clear").onclick=()=>{digits="";renderSlots()};
$("ok").onclick=()=>{
 if(valid(digits)){setValue();$("keypad").style.display="none";$("startBtn").classList.remove("active");$("endBtn").classList.remove("active");calculate()}
};
$("calculate").onclick=calculate;
$("theme").onclick=function(){body.classList.toggle("day");this.textContent=body.classList.contains("day")?"🌙":"☀️"};
$("opacity").oninput=function(){const a=this.value/100;card.style.background=body.classList.contains("day")?"rgba(255,255,255,"+a+")":"rgba(17,24,39,"+a+")"};
$("brightness").oninput=function(){card.style.filter="brightness("+this.value+"%)"};
$("style").onchange=function(){if(this.value==="glass"){card.style.borderRadius="25px";card.style.backdropFilter="blur(20px)"}else if(this.value==="soft"){card.style.borderRadius="32px";card.style.backdropFilter="blur(25px)"}else if(this.value==="neon"){card.style.borderRadius="18px";card.style.boxShadow="0 0 30px rgba(59,130,246,.3)"}else{card.style.borderRadius="10px";card.style.backdropFilter="none"}};
$("wallpaper").onchange=function(){const bg={none:"linear-gradient(135deg,#08111f,#162338 55%,#070d18)",palms:"linear-gradient(135deg,#075985,#0ea5a4 50%,#164e63)",mountains:"linear-gradient(135deg,#111827,#334155 50%,#0f172a)",christmas:"linear-gradient(135deg,#3f0d12,#7f1d1d 48%,#064e3b)",winter:"linear-gradient(135deg,#020617,#172554 55%,#0f172a)",stars:"radial-gradient(circle at 20% 20%,#fff 0 1px,transparent 2px),radial-gradient(circle at 80% 30%,#60a5fa 0 1px,transparent 2px),linear-gradient(135deg,#020617,#111827 60%,#1e1b4b)"};body.style.background=bg[this.value]};
$("customWallpaper").onchange=function(){const f=this.files&&this.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{body.style.backgroundImage="url('"+e.target.result+"')";body.style.backgroundSize="cover";body.style.backgroundPosition="center"};r.readAsDataURL(f)};
$("reset").onclick=()=>{values.start="12:00";values.end="13:45";$("startBtn").textContent="12:00";$("endBtn").textContent="13:45";$("style").value="glass";$("opacity").value=76;$("brightness").value=100;$("wallpaper").value="none";$("customWallpaper").value="";body.classList.remove("day");$("theme").textContent="☀️";$("keypad").style.display="none";calculate()};
body.classList.remove("day");calculate();
})();
</script>
</body>
</html>
